<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIに質問する</title>
  <link rel="stylesheet" href="/ai/style.css">
</head>
<body>
  <main class="ai">
    <nav class="ai-nav">
      <a href="/">TOP</a>
      <a href="/todo">TODO</a>
      <a href="/todo-v2">TODO V2</a>
    </nav>

    <h1>AIに質問する</h1>

    <form id="ai-form" class="ai-form" novalidate>
      <label for="ai-prompt">質問</label>
      <textarea id="ai-prompt" name="prompt" rows="4" placeholder="質問を入力してください（2000文字まで）" disabled></textarea>
      <div class="ai-form-footer">
        <span id="ai-counter" class="ai-counter" aria-live="polite">0 / 2000</span>
        <button type="submit" id="ai-submit" disabled>送信</button>
      </div>
    </form>

    <p id="ai-status" class="ai-status" role="status" aria-live="polite"></p>
    <p id="ai-error" class="ai-error" role="alert" hidden></p>

    <section class="ai-history" aria-labelledby="ai-history-title">
      <h2 id="ai-history-title">履歴（新しい順・最大20件）</h2>
      <p id="ai-empty" class="ai-empty" hidden>履歴がありません</p>
      <ol id="ai-list" class="ai-list"></ol>
    </section>

    <p class="ai-note">※ 授業用のデモです。個人情報や秘密の情報は入力しないでください。質問と回答は保存され、この画面を見られる人に表示されます。</p>
  </main>

  <script src="/ai/app.js"></script>
</body>
</html>
